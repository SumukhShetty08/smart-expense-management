services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smart_expense
      POSTGRES_USER: expense_user
      POSTGRES_PASSWORD: expense_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense_user -d smart_expense"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: change-this-before-deployment
      DATABASE_URL: postgresql+psycopg://expense_user:expense_password@db:5432/smart_expense
      CORS_ORIGINS: http://localhost:8000
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
